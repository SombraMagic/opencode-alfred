name: Idea
description: Una mejora o algo que falta
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Qué falta
      description: Describe la situación y qué esperarías conseguir.
    validations:
      required: true
  - type: textarea
    id: como
    attributes:
      label: Cómo lo imaginas
      description: Opcional. Si sabes qué panel o ajuste debería cambiar, dilo aquí.
    validations:
      required: false
