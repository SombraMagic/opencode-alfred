name: Fallo
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir: revisa que no sea un fallo del propio opencode, Claude Code o Codex.
        Para problemas de seguridad, no uses esta plantilla: mira [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué esperabas y qué ocurrió.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abro el panel...
        2. Pulso...
        3. Veo...
    validations:
      required: true
  - type: dropdown
    id: parte
    attributes:
      label: Parte de la extensión
      options:
        - Explorador / agentes
        - Contexto
        - Estadísticas
        - Conectores
        - Asignación de modelos
        - Voz
        - Dictado
        - Pizarra
        - Claude Code o Codex (experimental)
        - Otra
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de la extensión
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: Versión de VS Code
      placeholder: 1.90.0
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Errores o captura
      description: Salida de la consola de VS Code (Ayuda → Alternar herramientas de desarrollador), si la hay.
      render: text
    validations:
      required: false
