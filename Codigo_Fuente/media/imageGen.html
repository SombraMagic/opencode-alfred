<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src %%CSP%% data:; style-src %%CSP%% 'unsafe-inline'; script-src 'nonce-%%NONCE%%'; font-src %%CSP%%;" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
%%THEME_LINKS%%
<link href="%%STYLE%%" rel="stylesheet" />
<title>Generador de imágenes</title>
</head>
<body>
  <header class="gen-head">
    <div class="gen-brand">
      <span class="gen-dot" id="gen-dot" aria-hidden="true"></span>
      <span class="gen-kicker">GENERADOR DE IMÁGENES</span>
      <p class="gen-message" id="message" role="status" aria-live="polite"></p>
    </div>

    <div class="gen-conn" role="group" aria-label="Conexión con el proveedor">
      <div class="gen-field gen-field-prov">
        <label class="label" for="provider">PROVEEDOR</label>
        <select id="provider" class="gen-input">
          <option value="comfyui">ComfyUI</option>
          <option value="openai">OpenAI</option>
        </select>
      </div>
      <div class="gen-field" id="field-url">
        <label class="label" for="url">URL</label>
        <input id="url" class="gen-input" type="text" spellcheck="false" placeholder="http://127.0.0.1" autocomplete="off" title="Dirección del servidor de ComfyUI, con http:// o https://" />
      </div>
      <div class="gen-field gen-field-port" id="field-port">
        <label class="label" for="port">PUERTO</label>
        <input id="port" class="gen-input" type="number" min="1" max="65535" step="1" placeholder="8188" />
      </div>
      <button id="btn-connect" class="gen-btn" type="button" title="Probar la conexión con ComfyUI" aria-label="Conectar con ComfyUI">CONECTAR</button>
      <label class="gen-check gen-share"><input id="share" type="checkbox" title="Los agentes pueden generar imágenes mientras ComfyUI responda o haya una clave guardada" />COMPARTIR CON ALFRED</label>
      <div class="gen-field gen-field-key" id="field-key" hidden>
        <label class="label" for="key">CLAVE</label>
        <div class="gen-keyrow">
          <input id="key" class="gen-input" type="password" spellcheck="false" autocomplete="off" placeholder="clave" aria-label="Clave de OpenAI" />
          <span class="gen-key-dot" id="key-dot" title="Sin clave guardada" aria-hidden="true"></span>
          <button id="btn-save-key" class="gen-btn" type="button" title="Guardar la clave de OpenAI" aria-label="Guardar la clave de OpenAI">GUARDAR</button>
        </div>
      </div>
    </div>
  </header>

  <main class="gen-body">
    <section class="gen-col gen-left" aria-label="Ajustes de generación">
      <div class="gen-field">
        <label class="label" for="prompt">PROMPT</label>
        <textarea id="prompt" class="gen-input gen-textarea" rows="7" spellcheck="false" placeholder="Describe la imagen que quieres generar" aria-label="Prompt"></textarea>
      </div>

      <div class="gen-field">
        <span class="label" id="model-label">MODELO</span>
        <div class="gen-model-row" id="model-row">
          <select id="model" class="gen-input" aria-labelledby="model-label"></select>
          <button id="btn-model-reload" class="gen-icon-btn" type="button" title="Recargar la lista de modelos" aria-label="Recargar la lista de modelos"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 5v6h-6" /></svg></button>
        </div>
        <input id="model-input" class="gen-input" type="text" list="model-suggestions" spellcheck="false" autocomplete="off" placeholder="gpt-image-1" aria-labelledby="model-label" hidden />
        <datalist id="model-suggestions">
          <option value="gpt-image-1"></option>
          <option value="dall-e-3"></option>
          <option value="dall-e-2"></option>
        </datalist>
      </div>

      <div class="gen-field">
        <span class="label" id="size-label">TAMAÑO</span>
        <div class="gen-size" role="group" aria-labelledby="size-label">
          <label class="gen-sizefield">
            <span class="gen-mini">ANCHO</span>
            <input id="width" class="gen-input gen-num" type="number" min="64" max="2048" step="8" value="512" />
          </label>
          <span class="gen-times" aria-hidden="true">×</span>
          <label class="gen-sizefield">
            <span class="gen-mini">ALTO</span>
            <input id="height" class="gen-input gen-num" type="number" min="64" max="2048" step="8" value="512" />
          </label>
        </div>
        <p class="gen-hint" id="size-hint" hidden>Lo fija la imagen de partida.</p>
        <p class="gen-hint" id="size-openai-hint" hidden>Los modelos oficiales solo admiten sus tamaños; el host avisa si lo ajusta.</p>
      </div>

      <div class="gen-field" id="block-seed">
        <span class="label" id="seed-label">SEMILLA</span>
        <div class="gen-seed" role="group" aria-labelledby="seed-label">
          <input id="seed" class="gen-input gen-num" type="number" min="0" max="4294967295" step="1" value="0" aria-label="Semilla" />
          <button id="btn-seed" class="gen-icon-btn" type="button" title="Semilla aleatoria" aria-label="Semilla aleatoria"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="4" width="16" height="16" rx="3" /><circle cx="9.2" cy="9.2" r="1.15" fill="currentColor" stroke="none" /><circle cx="14.8" cy="14.8" r="1.15" fill="currentColor" stroke="none" /><circle cx="14.8" cy="9.2" r="1.15" fill="currentColor" stroke="none" /><circle cx="9.2" cy="14.8" r="1.15" fill="currentColor" stroke="none" /></svg></button>
          <label class="gen-check"><input id="seed-random" type="checkbox" checked />ALEATORIA</label>
          <label class="gen-tune"><span class="gen-mini">PASOS</span><input id="steps" class="gen-input gen-num gen-tune-input" type="number" min="1" max="150" step="1" value="20" aria-label="Pasos del muestreador" /></label>
          <label class="gen-tune"><span class="gen-mini">GUÍA</span><input id="cfg" class="gen-input gen-num gen-tune-input" type="number" min="1" max="30" step="0.5" value="7" aria-label="Guía (CFG)" /></label>
        </div>
      </div>

      <div class="gen-field" id="block-loras">
        <div class="gen-head-row">
          <span class="label" id="loras-label">LORAS</span>
          <select id="lora-pick" class="gen-input gen-lora-pick" aria-labelledby="loras-label"></select>
          <button id="btn-lora-add" class="gen-icon-btn" type="button" title="Añadir la LoRA elegida" aria-label="Añadir la LoRA elegida"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14" /><path d="M5 12h14" /></svg></button>
        </div>
        <div class="gen-loras" id="loras"></div>
      </div>

      <div class="gen-field" id="block-source">
        <span class="label">IMAGEN DE PARTIDA</span>
        <div class="gen-source">
          <button id="btn-source-pick" class="gen-btn" type="button" title="Elegir la imagen de partida" aria-label="Elegir la imagen de partida">ELEGIR</button>
          <div class="gen-thumb" id="source-wrap" hidden>
            <img id="source-thumb" alt="Imagen de partida" />
            <button id="btn-source-clear" class="gen-thumb-x" type="button" title="Quitar la imagen de partida" aria-label="Quitar la imagen de partida"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12" /><path d="M18 6L6 18" /></svg></button>
          </div>
          <label class="gen-sizefield" id="field-denoise">
            <span class="gen-mini">FUERZA</span>
            <input id="denoise" class="gen-input gen-num" type="number" min="0.1" max="1" step="0.05" value="0.6" title="Cuánto se parece a la imagen de partida: 0.1 la respeta, 1 la ignora" aria-label="Fuerza de la imagen de partida" />
          </label>
        </div>
      </div>

      <div class="gen-field">
        <label class="label" for="negative">PROMPT NEGATIVO</label>
        <textarea id="negative" class="gen-input gen-textarea gen-textarea-sm" rows="2" spellcheck="false" placeholder="Lo que no quieres que salga" aria-label="Prompt negativo"></textarea>
      </div>

      <div class="gen-actions">
        <button id="btn-generate" class="gen-btn gen-generate" type="button" title="Generar la imagen con los ajustes de la izquierda" aria-label="Generar la imagen">GENERAR</button>
        <span class="gen-progress" id="progress"></span>
      </div>
    </section>

    <section class="gen-col gen-right" aria-label="Resultado">
      <div class="gen-preview" id="preview-wrap">
        <img id="preview" alt="Imagen generada" hidden />
        <div class="gen-empty" id="preview-empty">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 15l4-4 4 4 3-3 5 5" /><circle cx="8.5" cy="9.5" r="1.2" /></svg>
          <span>Sin imagen</span>
        </div>
        <div class="gen-tools">
          <button id="btn-save" class="gen-icon-btn" type="button" title="Guardar la imagen como…" aria-label="Guardar la imagen como…" disabled><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v11" /><polyline points="7 10 12 15 17 10" /><path d="M4 20h16" /></svg></button>
          <button id="btn-copy" class="gen-icon-btn" type="button" title="Copiar la imagen al portapapeles" aria-label="Copiar la imagen" disabled><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V6a2 2 0 0 1 2-2h9" /></svg></button>
        </div>
      </div>

      <p class="gen-meta" id="preview-meta"></p>

      <div class="gen-hist">
        <div class="gen-hist-head">
          <span class="label">HISTORIAL</span>
          <button id="btn-clear-history" class="gen-icon-btn" type="button" title="Borrar todo el historial" aria-label="Borrar todo el historial"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16" /><path d="M10 4h4" /><path d="M6.5 7l.9 12.1a2 2 0 0 0 2 1.9h5.2a2 2 0 0 0 2-1.9L17.5 7" /><path d="M10 11v6" /><path d="M14 11v6" /></svg></button>
          <button id="btn-reload-history" class="gen-icon-btn" type="button" title="Recargar el historial" aria-label="Recargar el historial"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="21.7 5 21.7 10.2 16.4 10.2" /><polyline points="2.3 19 2.3 13.8 7.6 13.8" /><path d="M4.5 9.4a7.9 7.9 0 0 1 14.5-3L21.7 10.2" /><path d="M2.3 13.8l5.5 4.3A7.9 7.9 0 0 0 19.5 14.6" /></svg></button>
          <button id="btn-folder" class="gen-icon-btn" type="button" title="Abrir la carpeta de imágenes" aria-label="Abrir la carpeta de imágenes"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg></button>
        </div>
        <div class="gen-hist-strip" id="history" role="group" aria-label="Imágenes generadas"></div>
      </div>
    </section>
  </main>

%%THEME_SCRIPT%%
<script nonce="%%NONCE%%" src="%%SCRIPT%%"></script>
</body>
</html>
