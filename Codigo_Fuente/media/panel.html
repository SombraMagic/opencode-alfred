<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOZ</title>
    <link rel="stylesheet" href="{{styleUri}}" />
  </head>
  <body>
    <div class="hud">
      <div class="hud-header">
        <span class="hud-dot"></span>
        <span class="hud-title">VOZ // TTS</span>
        <span class="hud-status" id="status">EN LÍNEA</span>
      </div>

      <canvas id="equalizer" width="128" height="72"></canvas>

      <div class="readout" id="readout">
        <span id="readout-engine">—</span>
        <span id="readout-voice">—</span>
        <span id="readout-time">00:00</span>
      </div>

      <div class="controls">
        <label class="field">
          <span class="field-label">MOTOR</span>
          <select id="engine"></select>
        </label>

        <label class="field">
          <span class="field-label">VOZ</span>
          <select id="voice"></select>
        </label>

        <label class="field">
          <span class="field-label">SALIDA</span>
          <select id="device"></select>
        </label>

        <label class="field">
          <span class="field-label">VELOCIDAD <i id="rate-val">0%</i></span>
          <input type="range" id="rate" min="-50" max="100" step="5" value="0" />
        </label>

        <label class="field">
          <span class="field-label">TONO <i id="pitch-val">0Hz</i></span>
          <input type="range" id="pitch" min="-50" max="50" step="5" value="0" />
        </label>

        <label class="field">
          <span class="field-label">VOLUMEN <i id="volume-val">100%</i></span>
          <input type="range" id="volume" min="0" max="100" step="5" value="100" />
        </label>

        <label class="field">
          <span class="field-label">TEXTO</span>
          <textarea id="text" rows="4" placeholder="Escribe o pega el texto que quieres que se lea…"></textarea>
        </label>

        <button id="speak" class="speak-btn">
          <span class="speak-glyph">▶</span>
          <span id="speak-label">TRANSCRIBIR</span>
        </button>

        <div class="mcp-row">
          <button id="install-mcp" class="ghost-btn" title="Instalar el servidor MCP en tu agente de IA">
            INSTALAR MCP
          </button>
          <span class="mcp-hint" id="mcp-hint"></span>
        </div>
      </div>
    </div>

    <script src="{{scriptUri}}"></script>
  </body>
</html>
