<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src %%CSP%% data:; style-src %%CSP%% 'unsafe-inline'; script-src 'nonce-%%NONCE%%'; font-src %%CSP%%;" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
%%THEME_LINKS%%
<link href="%%STYLE%%" rel="stylesheet" />
<title>ALFRED // COMPARAR MODELOS</title>
</head>
<body>
<div class="mc">
  <header class="hud-header">
    <span class="hud-dot"></span>
    <span class="hud-title" title="Comparar las fichas de dos modelos">COMPARAR MODELOS</span>
    <span class="hud-status" id="status" role="status" aria-live="polite" hidden></span>
    <button class="ghost-btn" id="btn-compare-run" type="button" title="Comparar los dos modelos de las fichas" aria-label="Comparar los dos modelos" disabled>COMPARAR</button>
  </header>

  <p class="banner" id="notice" role="alert" hidden></p>

  <main class="board">
    <section class="col col-models" id="col-models" aria-labelledby="models-title">
      <h2 class="col-title" id="models-title">MODELOS <span class="count" id="models-count"></span></h2>
      <div class="list" id="model-list">
        <div id="model-rows"></div>
        <p class="empty" id="list-empty" hidden>No hay modelos en favoritos. Añádelos desde ASIGNAR AGENTES.</p>
      </div>
    </section>

    <section class="slot" id="slot-a" aria-labelledby="slot-a-title">
      <header class="slot-head">
        <span class="label" id="slot-a-title">MODELO A</span>
        <span class="slot-key" id="slot-a-key"></span>
        <button class="ghost-btn slot-clear" id="slot-a-clear" type="button" title="Vaciar el modelo A" aria-label="Vaciar el modelo A" hidden>✕</button>
      </header>
      <div class="slot-body" id="slot-a-body"></div>
    </section>

    <section class="slot" id="slot-b" aria-labelledby="slot-b-title">
      <header class="slot-head">
        <span class="label" id="slot-b-title">MODELO B</span>
        <span class="slot-key" id="slot-b-key"></span>
        <button class="ghost-btn slot-clear" id="slot-b-clear" type="button" title="Vaciar el modelo B" aria-label="Vaciar el modelo B" hidden>✕</button>
      </header>
      <div class="slot-body" id="slot-b-body"></div>
    </section>
  </main>
</div>
%%THEME_SCRIPT%%
<script nonce="%%NONCE%%" src="%%SCRIPT%%"></script>
</body>
</html>
