<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src %%CSP%% 'unsafe-inline'; script-src %%CSP%% 'nonce-%%NONCE%%';" />
<!--CSS-->
</head>
<body>
  <div class="dict">
    <section class="col config">
      <div class="col-title">CONFIGURACIÓN</div>

      <label class="field"><span class="field-label">MOTOR</span><select id="engine"></select></label>
      <div class="hint" id="engine-hint"></div>

      <label class="field"><span class="field-label">IDIOMA</span><select id="language"></select></label>

      <div class="row2">
        <button class="ghost-btn noise" id="denoise" aria-pressed="true" title="Quita retumbe y siseo del micrófono antes de transcribir">
          <span class="hf-dot"></span>FILTRAR
        </button>
        <button class="ghost-btn noise" id="lock-floor" aria-pressed="false" title="Fija el fondo medido para que no se mueva solo">
          <span class="hf-dot"></span><span id="lock-label">FIJAR</span>
        </button>
      </div>
      <label class="field">
        <span class="field-label">TOLERANCIA <i id="tolerance-value">+6 dB</i></span>
        <input id="tolerance" type="range" min="0" max="18" step="1" value="6" />
      </label>
      <div class="hint" id="floor">Fondo sin medir todavía.</div>

      <div class="field" id="whisper-row">
        <span class="field-label">MODELO WHISPER
          <button class="mini" id="install-whisper" type="button" title="Descarga e instala Whisper (una sola vez)">PREPARAR</button>
        </span>
        <select id="whisper-model"></select>
      </div>

      <label class="field" id="cloud-row"><span class="field-label">MODELO NUBE</span><input id="cloud-model" type="text" /></label>
      <div class="field" id="key-row">
        <span class="field-label">CLAVE API <i id="key-state"></i></span>
        <div class="inline">
          <input id="key" type="password" placeholder="sk-…" />
          <button class="ghost-btn" id="save-key" type="button">GUARDAR</button>
        </div>
      </div>
    </section>

    <section class="col note">
      <div class="col-title">BLOC DE NOTAS</div>
      <div id="nota" contenteditable="true" role="textbox" aria-label="Bloc de notas" aria-multiline="true" spellcheck="false" data-placeholder="Pulsa y mantén el micrófono, o escribe aquí…"></div>
      <div class="note-foot">
        <span id="count">0 palabras · 0 caracteres</span>
        <button class="ghost-btn" id="clear">LIMPIAR</button>
      </div>
    </section>

    <section class="col controls">
      <div class="col-title">CONTROLES</div>
      <div class="mic-wrap">
        <button id="mic" class="mic" title="Mantén pulsado para dictar" aria-label="Mantener pulsado para dictar">
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
            <rect x="9" y="2.5" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span class="mic-ring"></span>
        </button>
        <div class="level"><i id="level-bar"></i></div>
      </div>
      <div class="state" id="state">EN ESPERA</div>
      <div class="state-hint" id="state-hint">Mantén el micrófono, o activa MANOS LIBRES</div>
      <button class="ghost-btn hands-free" id="hands-free" aria-pressed="false" title="Un clic para escuchar; otro para parar">
        <span class="hf-dot"></span>MANOS LIBRES
      </button>
      <button class="speak-btn" id="send"><span class="speak-glyph">▶</span>ENVIAR PROMPT</button>
      <div class="hint" id="send-hint">Al terminal activo, con Enter</div>
    </section>
  </div>
  <!--SCRIPT-->
</body>
</html>
